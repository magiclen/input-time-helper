<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- <script src="https://cdn.jsdelivr.net/gh/magiclen/input-time-helper/dist/input-time-helper.min.js"></script> -->
        <script src="./dist/input-time-helper.min.js"></script>
        <title>input-time-helper</title>

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
    </head>

    <body class="p-3 p-lg-5">
        <div id="demo-input-time-helper" class="container">
            <div class="row g-3">
                <div class="col-12">Local Timezone: <span id="timezone"></span></div>
                <div class="col-12">
                    <div class="card">
                        <div class="card-header">
                            Confusing Input (input[type="datetime-local"])
                        </div>
                        <div class="card-body">
                            <div class="row g-3 align-items-center">
                                <div class="col-12">
                                    <input
                                        type="datetime-local"
                                        id="confusion"
                                        class="form-control"
                                    />
                                </div>
                                <div class="col-12">
                                    <div class="form-floating">
                                        <input
                                            type="number"
                                            id="confusion-timestamp"
                                            class="form-control is-invalid"
                                            placeholder="timestamp"
                                            step="1"
                                        />
                                        <label for="confusion-timestamp">timestamp</label>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <div class="form-floating">
                                        <input
                                            type="text"
                                            id="confusion-locale-string"
                                            class="form-control is-invalid"
                                            placeholder="locale string"
                                            readonly
                                        />
                                        <label for="confusion-locale-string">locale string</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-12">
                    <div class="card">
                        <div class="card-header">input[type="date"]</div>
                        <div class="card-body">
                            <div class="row g-3 align-items-center">
                                <div class="col-12 col-sm-6">
                                    <div class="form-floating">
                                        <input type="date" id="date-from" class="form-control" />
                                        <label for="date-from">from</label>
                                    </div>
                                </div>
                                <div class="col-12 col-sm-6">
                                    <div class="form-floating">
                                        <input type="date" id="date-to" class="form-control" />
                                        <label for="date-to">to</label>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <input type="date" id="date" class="form-control" />
                                </div>
                                <div class="col-12">
                                    <div class="form-floating">
                                        <input
                                            type="number"
                                            id="date-timestamp"
                                            class="form-control"
                                            placeholder="timestamp"
                                            step="1"
                                        />
                                        <label for="date-timestamp">timestamp</label>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <div class="form-floating">
                                        <input
                                            type="text"
                                            id="date-locale-string"
                                            class="form-control"
                                            placeholder="locale string"
                                            readonly
                                        />
                                        <label for="date-locale-string">locale string</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-12">
                    <div class="card">
                        <div class="card-header">input[type="time"]</div>
                        <div class="card-body">
                            <div class="row g-3 align-items-center">
                                <div class="col-12 col-sm-6">
                                    <div class="form-floating">
                                        <input type="time" id="time-from" class="form-control" />
                                        <label for="time-from">from</label>
                                    </div>
                                </div>
                                <div class="col-12 col-sm-6">
                                    <div class="form-floating">
                                        <input type="time" id="time-to" class="form-control" />
                                        <label for="time-to">to</label>
                                    </div>
                                </div>
                                <div class="col">
                                    <input type="time" id="time" class="form-control" step="1" />
                                </div>
                                <div class="col-auto">
                                    <button type="button" id="time-now" class="btn btn-primary">
                                        Now
                                    </button>
                                </div>
                                <div class="col-12">
                                    <div class="form-floating">
                                        <input
                                            type="text"
                                            id="time-locale-string"
                                            class="form-control"
                                            placeholder="locale time string"
                                            readonly
                                        />
                                        <label for="time-locale-string">locale time string</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-12">
                    <div class="card">
                        <div class="card-header">input[type="datetime-local"]</div>
                        <div class="card-body">
                            <div class="row g-3 align-items-center">
                                <div class="col-12 col-sm-6">
                                    <div class="form-floating">
                                        <input
                                            type="datetime-local"
                                            id="datetime-from"
                                            class="form-control"
                                        />
                                        <label for="datetime-from">from</label>
                                    </div>
                                </div>
                                <div class="col-12 col-sm-6">
                                    <div class="form-floating">
                                        <input
                                            type="datetime-local"
                                            id="datetime-to"
                                            class="form-control"
                                        />
                                        <label for="datetime-to">to</label>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <input
                                        type="datetime-local"
                                        id="datetime"
                                        class="form-control"
                                    />
                                </div>
                                <div class="col-12">
                                    <div class="form-check form-check-inline">
                                        <input
                                            id="datetime-unit-minute"
                                            class="form-check-input"
                                            type="radio"
                                            name="datetime-unit"
                                            value="minute"
                                            checked
                                        />
                                        <label class="form-check-label" for="datetime-unit-minute"
                                            >Minute</label
                                        >
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input
                                            id="datetime-unit-second"
                                            class="form-check-input"
                                            type="radio"
                                            name="datetime-unit"
                                            value="second"
                                        />
                                        <label class="form-check-label" for="datetime-unit-second"
                                            >Second</label
                                        >
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input
                                            id="datetime-unit-millisecond"
                                            class="form-check-input"
                                            type="radio"
                                            name="datetime-unit"
                                            value="millisecond"
                                        />
                                        <label
                                            class="form-check-label"
                                            for="datetime-unit-millisecond"
                                            >Millisecond</label
                                        >
                                    </div>
                                </div>
                                <div class="col-12">
                                    <div class="form-floating">
                                        <input
                                            type="number"
                                            id="datetime-timestamp"
                                            class="form-control"
                                            placeholder="timestamp"
                                            step="1"
                                        />
                                        <label for="datetime-timestamp">timestamp</label>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <div class="form-floating">
                                        <input
                                            type="text"
                                            id="datetime-locale-string"
                                            class="form-control"
                                            placeholder="locale string"
                                            readonly
                                        />
                                        <label for="datetime-locale-string">locale string</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script>
            const timezone = document.getElementById("timezone");

            timezone.textContent = InputTimeHelper.formatTimezoneOffset(
                new Date().getTimezoneOffset(),
            );

            const inputConfusion = document.getElementById("confusion");
            const inputConfusionTimestamp = document.getElementById("confusion-timestamp");
            const inputConfusionLocaleString = document.getElementById("confusion-locale-string");

            inputConfusion.addEventListener("input", () => {
                const timestamp = inputConfusion.valueAsNumber;

                inputConfusionTimestamp.value = timestamp.toString();

                inputConfusionLocaleString.value = new Date(timestamp).toLocaleString();
            });

            inputConfusionTimestamp.addEventListener("input", () => {
                const timestamp = parseInt(inputConfusionTimestamp.value);

                inputConfusion.valueAsNumber = timestamp;

                inputConfusionLocaleString.value = new Date(timestamp).toLocaleString();
            });

            const inputDateFrom = document.getElementById("date-from");
            const inputDateTo = document.getElementById("date-to");
            const inputDate = document.getElementById("date");
            const inputDateTimestamp = document.getElementById("date-timestamp");
            const inputDateLocaleString = document.getElementById("date-locale-string");

            inputDateFrom.addEventListener("input", () => {
                // we can just use `.value`, but this is a demo

                const date = InputTimeHelper.getValueAsLocalDate(inputDateFrom);

                const dateString = date === null ? "" : InputTimeHelper.formatDate(date);

                inputDateTo.min = dateString;
                inputDate.min = dateString;
            });

            inputDateTo.addEventListener("input", () => {
                // we can just use `.value`, but this is a demo

                const date = InputTimeHelper.getValueAsLocalDate(inputDateTo);

                const dateString = date === null ? "" : InputTimeHelper.formatDate(date);

                inputDateFrom.max = dateString;
                inputDate.max = dateString;
            });

            inputDate.addEventListener("input", () => {
                const date = InputTimeHelper.getValueAsLocalDate(inputDate);

                inputDateTimestamp.value = date === null ? "" : date.getTime().toString();

                inputDateLocaleString.value = date === null ? "" : date.toLocaleString();
            });

            inputDateTimestamp.addEventListener("input", () => {
                const timestamp = parseInt(inputDateTimestamp.value);

                InputTimeHelper.setValueAsLocalDate(inputDate, timestamp);

                inputDateLocaleString.value = new Date(timestamp).toLocaleString();
            });

            const inputTimeFrom = document.getElementById("time-from");
            const inputTimeTo = document.getElementById("time-to");
            const inputTime = document.getElementById("time");
            const buttonTimeNow = document.getElementById("time-now");
            const inputTimeLocaleString = document.getElementById("time-locale-string");

            inputTimeFrom.addEventListener("input", () => {
                // we can just use `.value`, but this is a demo

                const date = InputTimeHelper.getValueAsLocalDate(inputTimeFrom);

                const timeString = date === null ? "" : InputTimeHelper.formatTime(date);

                inputTimeTo.min = timeString;
                inputTime.min = timeString;
            });

            inputTimeTo.addEventListener("input", () => {
                // we can just use `.value`, but this is a demo

                const date = InputTimeHelper.getValueAsLocalDate(inputTimeTo);

                const timeString = date === null ? "" : InputTimeHelper.formatTime(date);

                inputTimeFrom.max = timeString;
                inputTime.max = timeString;
            });

            inputTime.addEventListener("input", () => {
                const date = InputTimeHelper.getValueAsLocalDate(inputTime);

                inputTimeLocaleString.value = date === null ? "" : date.toLocaleTimeString();
            });

            buttonTimeNow.addEventListener("click", () => {
                // the step is 1 second, so the milliseconds are rounded down
                InputTimeHelper.setValueAsLocalDate(inputTime, new Date());

                inputTime.dispatchEvent(new CustomEvent("input"));
            });

            const inputDatetimeFrom = document.getElementById("datetime-from");
            const inputDatetimeTo = document.getElementById("datetime-to");
            const inputDatetime = document.getElementById("datetime");
            const inputDatetimeTimestamp = document.getElementById("datetime-timestamp");
            const inputDatetimeLocaleString = document.getElementById("datetime-locale-string");
            const inputDatetimeUnit = () =>
                document.querySelector("input[name='datetime-unit']:checked");

            inputDatetimeFrom.addEventListener("input", () => {
                // we can just use `.value`, but this is a demo

                const date = InputTimeHelper.getValueAsLocalDate(inputDatetimeFrom);

                const datetimeString = date === null ? "" : InputTimeHelper.formatDatetime(date);

                inputDatetimeTo.min = datetimeString;
                inputDatetime.min = datetimeString;
            });

            inputDatetimeTo.addEventListener("input", () => {
                // we can just use `.value`, but this is a demo

                const date = InputTimeHelper.getValueAsLocalDate(inputDatetimeTo);

                const datetimeString = date === null ? "" : InputTimeHelper.formatDatetime(date);

                inputDatetimeFrom.max = datetimeString;
                inputDatetime.max = datetimeString;
            });

            inputDatetime.addEventListener("input", () => {
                const date = InputTimeHelper.getValueAsLocalDate(inputDatetime);

                inputDatetimeTimestamp.value = date === null ? "" : date.getTime().toString();

                inputDatetimeLocaleString.value = date === null ? "" : date.toLocaleString();
            });

            inputDatetimeTimestamp.addEventListener("input", () => {
                const timestamp = parseInt(inputDatetimeTimestamp.value);

                InputTimeHelper.setValueAsLocalDate(inputDatetime, timestamp);

                inputDatetimeLocaleString.value = new Date(timestamp).toLocaleString();
            });

            for (const e of document.querySelectorAll("input[name='datetime-unit']")) {
                e.addEventListener("change", () => {
                    switch (inputDatetimeUnit().value) {
                        case "minute":
                            inputDatetime.step = InputTimeHelper.TimeUnit.Minute;
                            break;
                        case "second":
                            inputDatetime.step = InputTimeHelper.TimeUnit.Second;
                            break;
                        default: // case "millisecond":
                            inputDatetime.step = InputTimeHelper.TimeUnit.Millisecond;
                            break;
                    }

                    inputDatetimeTimestamp.dispatchEvent(new CustomEvent("input"));
                    inputDatetime.dispatchEvent(new CustomEvent("input"));
                });
            }
        </script>
    </body>
</html>
